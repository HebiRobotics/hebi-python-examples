# Tready arm: R-Series 6-DoF arm with gripper (A-2240-06G)
version: 1.0
families: ["Arm"]
names: ["J1_base", "J2_shoulder", "J3_elbow", "J4_wrist1", "J5_wrist2", "J6_wrist3"]
hrdf: "hrdf/tready-arm-A2240-06G.hrdf"

gains:
  default: "gains/A-2240-06.xml"
  gripper: "gains/gripper_spool_gains.xml"

user_data:
  # Seed for inverse kinematics (AR demo home pose is solved from this)
  ik_seed_pos:   [ 0.30,  1.2,  2.2,  2.9, -1.57, 0]
  # Joint-space home (joystick demo)
  home_position: [ 0.30,  1.2,  2.2,  2.9, -1.57, 0]

  homing_time: 5.0            # s
  trajectory_duration: 0.5    # s, AR teleop goal duration
  xyz_scale: [1.0, 1.0, 1.0]

  # Gripper (demos continue without it if it isn't found)
  has_gripper: true
  gripper_close_effort: -5.0  # Nm
  gripper_open_effort: 1.0    # Nm

plugins:
  - type: GravityCompensationEffort
    name: gravComp
    enabled: true
    ramp_time: 5

  - type: DynamicsCompensationEffort
    name: dynamicsComp
    enabled: true
    ramp_time: 5
